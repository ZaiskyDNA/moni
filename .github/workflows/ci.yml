name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Batalkan run lama di branch yang sama kalau ada push baru.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostgreSQL sungguhan untuk integration test (PRD 8.5). Versinya disamakan dengan docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: cipassword
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:cipassword@localhost:5432/app_test
    steps:
      - name: Checkout kode
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Migrasi database test
        run: npx prisma migrate deploy

      # Satu kali jalan untuk unit + integration test sekaligus menghasilkan laporan coverage.
      - name: Unit & integration test (dengan coverage)
        run: npm run test:coverage

      - name: Upload laporan coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info
          if-no-files-found: warn

  docker-smoke-test:
    name: Docker Smoke Test
    needs: lint-test
    runs-on: ubuntu-latest
    env:
      # Uji image yang sama dengan yang nanti di-deploy.
      BACKEND_TARGET: production
    steps:
      - name: Checkout kode
        uses: actions/checkout@v7

      # .env tidak di-commit, jadi CI membuat .env sementara dengan nilai uji.
      - name: Siapkan .env untuk CI
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=app
          POSTGRES_PASSWORD=cipassword
          POSTGRES_DB=app_db
          BACKEND_PORT=3000
          DB_PORT=5432
          CORS_ORIGIN=*
          JWT_SECRET=ci-access-secret
          JWT_REFRESH_SECRET=ci-refresh-secret
          EOF

      - name: Build image dan jalankan backend + database
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Cek endpoint health
        run: |
          curl --fail --silent --show-error http://localhost:3000/api/v1/health
          echo
          curl --fail --silent --show-error http://localhost:3000/api/v1/health/ready
          echo

      # Memastikan argon2 (modul native) dan migrasi tabel users jalan di image production (Alpine).
      - name: Cek alur register & login
        run: |
          curl --fail --silent --show-error -X POST http://localhost:3000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@smoke.test","password":"rahasia123"}'
          echo
          curl --fail --silent --show-error -o /dev/null -X POST http://localhost:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@smoke.test","password":"rahasia123"}'

      - name: Tampilkan log container (kalau gagal)
        if: failure()
        run: docker compose logs

      - name: Bersihkan
        if: always()
        run: docker compose down -v
