services:
  backend:
    build:
      context: ./backend
      # `dev` untuk development (default). CI memakai BACKEND_TARGET=production.
      target: ${BACKEND_TARGET:-dev}
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      EXCHANGE_RATE_API_BASE_URL: ${EXCHANGE_RATE_API_BASE_URL:-}
      EXCHANGE_RATE_BASE_CURRENCY: ${EXCHANGE_RATE_BASE_CURRENCY:-}
      EXCHANGE_RATE_TRACKED_CURRENCIES: ${EXCHANGE_RATE_TRACKED_CURRENCIES:-}
      EXCHANGE_RATE_CRON_SCHEDULE: ${EXCHANGE_RATE_CRON_SCHEDULE:-}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Dipakai oleh `docker compose up --watch`. Lebih andal daripada bind mount di Windows.
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/package-lock.json

  ml-service:
    build:
      context: ./ml-service
      # `dev` untuk development (default, auto-reload). CI memakai ML_SERVICE_TARGET=production.
      target: ${ML_SERVICE_TARGET:-dev}
    environment:
      PORT: 8000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    init: true
    healthcheck:
      # python:3.12-slim tidak punya wget/curl bawaan, jadi pakai urllib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./ml-service/app
          target: /app/app
        - action: rebuild
          path: ./ml-service/requirements.txt
        - action: rebuild
          path: ./ml-service/requirements-dev.txt

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER belum diset, buat file .env (lihat README)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diset, buat file .env (lihat README)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB belum diset, buat file .env (lihat README)}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
